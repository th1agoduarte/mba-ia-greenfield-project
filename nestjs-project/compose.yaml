services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # Video worker (FFmpeg): same image and source as the API, separate process
  # that consumes the RabbitMQ queue (phase-03-videos/TD-05). It waits for the
  # dependencies installed by `docker compose exec nestjs-api npm install`.
  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command:
      - sh
      - -c
      - >-
        until [ -e node_modules/.bin/ts-node ]; do
        echo "video-worker: waiting for node_modules (run: docker compose exec nestjs-api npm install)";
        sleep 5; done;
        npm run start:worker:dev
    volumes:
      - .:/home/node/app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Object storage (S3-compatible). The official minio/minio image is no longer
  # published; pgsty/minio is a maintained MinIO build (see
  # docs/phases/phase-03-videos/library-refs.md).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      # Admin console (root credentials): host loopback only.
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-streamtube}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-streamtube-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the private video bucket (idempotent) and exits.
  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set none "local/$${S3_BUCKET}"
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-streamtube}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-streamtube-secret}
      - S3_BUCKET=${S3_BUCKET:-streamtube-videos}

  # Message broker for the video processing queue.
  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      # Management UI (default credentials): host loopback only.
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-streamtube}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-streamtube}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  minio-data:
